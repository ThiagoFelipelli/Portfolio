<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
  <link rel="stylesheet" href="css/style.css">
  <section>
<h1>
      <di class="menu">
            <a href="index.html">Menu</a>
        </di>
    <header class="flex">

            <a href="formulario.html">Formulario</a>
            <a href="multimidia.html">Multimidia</a>
            <a href="graficos.html">Graficos</a>
        
    </header>
</h1>
</section>
</head>
<body>
  <main>
    <h1>Formulário</h1>

    <form id="form" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>

        <div>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" placeholder="Escreva seu nome aqui...">
          <p class="erro" id="erro-nome"></p>
        </div>

        <div>
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="Escreva seu e-mail aqui...">
          <p class="erro" id="erro-email"></p>
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" placeholder="11-99999-9999">
        </div>

        <div>
          <label for="tipo">Tipo de contato:</label>
          <select id="tipo" name="tipo">
            <option value="oportunidade">Oportunidade de trabalho</option>
            <option value="freelance">Projeto freelance</option>
            <option value="duvida">Dúvida</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div>
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="10" placeholder="Escreva sua mensagem aqui..."></textarea>
          <p class="erro" id="erro-mensagem"></p>
        </div>

        <button type="submit">Enviar</button>
        <p id="feedback" role="status"></p>
      </fieldset>
    </form>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
